<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Worker Hours — Fosters Fencing</title>
<link rel="manifest" href="manifest-timeclock.json" />
<meta name="theme-color" content="#163b6b" />
<link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FF Admin" />
<style>
  :root {
    --ink: #142235; --ink-soft: #51637a; --paper: #eef1f6; --paper-raised: #ffffff;
    --line: #d7dee6; --steel: #6b7887; --accent: #163b6b; --accent-soft: #e2e9f3;
    --gold: #b9852a; --gold-soft: #f6ecd6; --brand-red: #b8262a; --brand-red-soft: #f5dfe0;
    --green: #1e7a4a; --green-soft: #dcf0e4; --focus: #163b6b;
    --shadow: 0 1px 2px rgba(20, 34, 53, 0.07), 0 4px 12px rgba(20, 34, 53, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8ecf1; --ink-soft: #a9b5c4; --paper: #0e1620; --paper-raised: #161f2b;
      --line: #263242; --steel: #8592a2; --accent: #6c9bdb; --accent-soft: #1d2c40;
      --gold: #dfb151; --gold-soft: #372c14; --brand-red: #e2585b; --brand-red-soft: #3a2124;
      --green: #4ec089; --green-soft: #17351f; --focus: #6c9bdb;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 16px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --ink: #e8ecf1; --ink-soft: #a9b5c4; --paper: #0e1620; --paper-raised: #161f2b;
    --line: #263242; --steel: #8592a2; --accent: #6c9bdb; --accent-soft: #1d2c40;
    --gold: #dfb151; --gold-soft: #372c14; --brand-red: #e2585b; --brand-red-soft: #3a2124;
    --green: #4ec089; --green-soft: #17351f; --focus: #6c9bdb;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 16px rgba(0, 0, 0, 0.35);
  }
  :root[data-theme="light"] {
    --ink: #142235; --ink-soft: #51637a; --paper: #eef1f6; --paper-raised: #ffffff;
    --line: #d7dee6; --steel: #6b7887; --accent: #163b6b; --accent-soft: #e2e9f3;
    --gold: #b9852a; --gold-soft: #f6ecd6; --brand-red: #b8262a; --brand-red-soft: #f5dfe0;
    --green: #1e7a4a; --green-soft: #dcf0e4; --focus: #163b6b;
    --shadow: 0 1px 2px rgba(20, 34, 53, 0.07), 0 4px 12px rgba(20, 34, 53, 0.06);
  }

  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45; max-width: 920px; margin: 0 auto; min-height: 100vh;
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .brandbar { height: 6px; background: linear-gradient(90deg, var(--accent) 0%, #2f5c9c 55%, var(--gold) 100%); }
  .page-pad { padding: clamp(16px, 4vw, 32px); }

  .tabnav { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; margin-bottom: 20px; }
  .tabnav a { color: var(--ink-soft); text-decoration: none; padding: 4px 0; border-bottom: 2px solid transparent; }
  .tabnav a.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tabnav a:hover { color: var(--accent); }

  header.page { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .badge-mark { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 3px solid var(--gold); box-shadow: var(--shadow); flex: none; }
  .eyebrow { font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--steel); }
  h1 { font-size: clamp(20px, 4vw, 26px); margin: 2px 0 0; letter-spacing: -0.01em; }

  .card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); }
  .screen[hidden] { display: none; }

  /* --- login screen --- */
  #screenLogin { max-width: 380px; margin: 40px auto 0; display: flex; flex-direction: column; gap: 14px; }
  .pin-label { text-align: center; font-size: 15px; color: var(--ink-soft); }
  .pin-input {
    width: 100%; box-sizing: border-box; font-size: 30px; letter-spacing: 0.3em; text-align: center;
    padding: 14px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper);
    color: var(--ink); font-family: ui-monospace, monospace;
  }
  .pin-input:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn { appearance: none; border: none; border-radius: 12px; padding: 14px 20px; font-size: 15.5px; font-weight: 700; cursor: pointer; }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; width: 100%; }
  .btn-ghost { background: var(--accent-soft); color: var(--accent); }
  .msg { font-size: 13.5px; border-radius: 10px; padding: 10px 14px; }
  .msg.error { background: var(--brand-red-soft); color: var(--brand-red); }
  .msg.info { background: var(--accent-soft); color: var(--accent); }
  .msg[hidden] { display: none; }

  /* --- dashboard screen --- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
  .toolbar .spacer { flex: 1; }
  .signout-link { background: none; border: none; color: var(--steel); font-size: 12.5px; text-decoration: underline; cursor: pointer; padding: 8px 0; }

  .worker-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .worker-chip {
    appearance: none; border: 1px solid var(--line); background: var(--paper-raised); border-radius: 999px;
    padding: 9px 16px; font-size: 13.5px; font-weight: 600; color: var(--ink); cursor: pointer;
    display: flex; align-items: center; gap: 8px; font-family: inherit;
  }
  .worker-chip:hover { border-color: var(--accent); }
  .worker-chip .hrs { color: var(--ink-soft); font-weight: 500; font-variant-numeric: tabular-nums; }
  .worker-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .worker-chip.active .hrs { color: rgba(255, 255, 255, 0.85); }

  .summary-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
  .summary-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; box-shadow: var(--shadow); min-width: 140px; }
  .summary-card .label { font-size: 12px; color: var(--steel); text-transform: uppercase; letter-spacing: 0.03em; }
  .summary-card .value { font-size: 20px; font-weight: 700; margin-top: 2px; }
  .summary-card.open .value { color: var(--green); }

  table.hours { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.hours th, table.hours td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.hours th { color: var(--steel); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  table.hours td.hours { text-align: right; font-variant-numeric: tabular-nums; }
  table.hours tr.open-row { background: var(--green-soft); }
  table.hours a.loc-link { color: var(--accent); text-decoration: none; font-size: 12.5px; }
  table.hours a.loc-link:hover { text-decoration: underline; }
  .table-wrap { overflow-x: auto; }
  .empty-note { color: var(--steel); font-size: 13.5px; text-align: center; padding: 20px 0; }

  details.week { border-top: 1px dashed var(--line); padding-top: 16px; margin-top: 10px; }
  details.week + details.week { margin-top: 18px; }
  details.week summary {
    cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 600; color: var(--steel); text-transform: uppercase;
    letter-spacing: 0.05em; padding: 2px 0;
  }
  details.week summary::-webkit-details-marker { display: none; }
  details.week summary::before { content: "▸"; font-size: 11px; color: var(--gold); transition: transform 0.15s ease; }
  details.week[open] summary::before { transform: rotate(90deg); }
  details.week summary .n {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    color: var(--ink-soft); font-weight: 500; text-transform: none; letter-spacing: 0;
  }
  details.week .week-body { padding-top: 16px; }

  footer.page { text-align: center; font-size: 12px; color: var(--steel); padding: 24px 0 10px; }
</style>
</head>
<body>

<div class="brandbar" aria-hidden="true"></div>

<div class="page-pad">

<nav class="tabnav">
  <a href="index.html">Home</a>
  <a href="quote-scheduler.html">Approved Jobs</a>
  <a href="enquiries.html">New Enquiries</a>
  <a href="clock-in.html">Clock In</a>
  <a href="admin-hours.html" class="active">Admin</a>
</nav>

<header class="page">
  <img class="badge-mark" src="assets/fosters-fencing-logo.jpg" alt="Fosters Fencing logo" />
  <div>
    <span class="eyebrow">Fosters Fencing</span>
    <h1>Worker Hours — Admin</h1>
  </div>
</header>

<!-- Login screen -->
<section id="screenLogin" class="screen">
  <div class="card" style="display:flex; flex-direction:column; gap:14px;">
    <p class="pin-label">Owner / Admin PIN</p>
    <input type="password" inputmode="numeric" autocomplete="off" class="pin-input" id="pinInput" placeholder="••••" maxlength="20" />
    <div class="msg error" id="loginError" hidden></div>
    <button type="button" class="btn btn-primary" id="pinSubmitBtn">Sign in</button>
  </div>
</section>

<!-- Dashboard screen -->
<section id="screenDashboard" class="screen" hidden>
  <div class="toolbar">
    <div class="worker-chips" id="workerChips"></div>
    <div class="spacer"></div>
    <button type="button" class="signout-link" id="signOutBtn">Sign out</button>
  </div>

  <div class="msg error" id="dashError" hidden></div>

  <div class="summary-row" id="summaryRow"></div>

  <div id="weeksContainer"></div>
</section>

</div>

<footer class="page">Fosters Fencing — Admin view. Read-only: edits happen in the Supabase dashboard.</footer>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// ---- Configuration -------------------------------------------------------
// Same Supabase project as demo/clock-in.html. See docs/clock-in-setup.md.
const CONFIG = {
  supabaseUrl: "https://fvytzzsdbjowtmyonkso.supabase.co",
  supabaseAnonKey: "sb_publishable_weArTG3Bwp0MGJhKvx-KRQ_YnG10_bu",
  // The login email for the owner's admin account (profiles.is_admin = true).
  adminEmail: "owner@fostersfencing.local"
};
// ---------------------------------------------------------------------------

const supabase = createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey, {
  auth: { storageKey: "ff-admin-auth", persistSession: true, autoRefreshToken: true }
});

const screenLogin = document.getElementById("screenLogin");
const screenDashboard = document.getElementById("screenDashboard");
const pinInput = document.getElementById("pinInput");
const pinSubmitBtn = document.getElementById("pinSubmitBtn");
const loginError = document.getElementById("loginError");
const signOutBtn = document.getElementById("signOutBtn");
const workerChips = document.getElementById("workerChips");
const dashError = document.getElementById("dashError");
const summaryRow = document.getElementById("summaryRow");
const weeksContainer = document.getElementById("weeksContainer");

function showScreen(screen) {
  for (const s of [screenLogin, screenDashboard]) s.hidden = s !== screen;
}

function fmtDateTime(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleString(undefined, { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
}
function fmtHours(h) {
  if (h === null || h === undefined) return "—";
  const hrs = Math.floor(h);
  const mins = Math.round((h - hrs) * 60);
  return `${hrs}h ${String(mins).padStart(2, "0")}m`;
}
function locLink(lat, lng) {
  if (lat === null || lat === undefined || lng === null || lng === undefined) return "—";
  const url = `https://www.google.com/maps?q=${lat},${lng}`;
  return `<a class="loc-link" href="${url}" target="_blank" rel="noopener">Map ↗</a>`;
}

// Pay weeks run Friday–Thursday. Deliberately uses the browser's LOCAL date
// parts (not UTC) — everyone using this page is in the same timezone as the
// jobsite, so this avoids an early-morning clock-in near a UTC day boundary
// landing in the wrong week.
function weekInfoFor(date) {
  const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const dow = date.getDay();
  const daysSinceFriday = (dow - 5 + 7) % 7;
  const friday = new Date(date.getFullYear(), date.getMonth(), date.getDate() - daysSinceFriday);
  const thursday = new Date(friday.getFullYear(), friday.getMonth(), friday.getDate() + 6);
  const sameMonth = friday.getMonth() === thursday.getMonth();
  const start = sameMonth ? `${friday.getDate()}` : `${friday.getDate()} ${monthNames[friday.getMonth()]}`;
  const end = `${thursday.getDate()} ${monthNames[thursday.getMonth()]} ${thursday.getFullYear()}`;
  const key = `${friday.getFullYear()}-${String(friday.getMonth() + 1).padStart(2, "0")}-${String(friday.getDate()).padStart(2, "0")}`;
  return { key, friday, label: `Pay week ${start}–${end}` };
}

function groupByWeek(entries) {
  const weeks = {};
  entries.forEach((e) => {
    const info = weekInfoFor(new Date(e.clock_in_at));
    if (!weeks[info.key]) weeks[info.key] = { key: info.key, label: info.label, friday: info.friday, items: [] };
    weeks[info.key].items.push(e);
  });
  return Object.values(weeks).sort((a, b) => b.friday - a.friday);
}

async function signIn() {
  const pin = pinInput.value.trim();
  if (!pin) return;
  loginError.hidden = true;
  pinSubmitBtn.disabled = true;
  pinSubmitBtn.textContent = "Signing in…";
  const { error } = await supabase.auth.signInWithPassword({ email: CONFIG.adminEmail, password: pin });
  pinSubmitBtn.disabled = false;
  pinSubmitBtn.textContent = "Sign in";
  if (error) {
    loginError.textContent = "Incorrect PIN — try again.";
    loginError.hidden = false;
    pinInput.value = "";
    pinInput.focus();
    return;
  }
  await enterDashboard();
}

pinSubmitBtn.addEventListener("click", signIn);
pinInput.addEventListener("keydown", (e) => { if (e.key === "Enter") signIn(); });

signOutBtn.addEventListener("click", async () => {
  await supabase.auth.signOut();
  showScreen(screenLogin);
  pinInput.value = "";
});

let workers = [];
let allEntries = [];
let selectedWorkerId = null; // null = all workers

async function enterDashboard() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { showScreen(screenLogin); return; }

  const { data: profile, error: profileErr } = await supabase
    .from("profiles")
    .select("id, name, is_admin")
    .eq("id", session.user.id)
    .maybeSingle();

  if (profileErr || !profile || !profile.is_admin) {
    loginError.textContent = "This login isn't an admin account.";
    loginError.hidden = false;
    await supabase.auth.signOut();
    showScreen(screenLogin);
    return;
  }

  const { data: profileRows } = await supabase.from("profiles").select("id, name").order("name");
  workers = profileRows || [];

  showScreen(screenDashboard);
  await loadHours();
}

async function loadHours() {
  dashError.hidden = true;
  const { data, error } = await supabase
    .from("time_entries")
    .select("id, worker_id, clock_in_at, clock_in_lat, clock_in_lng, clock_out_at, clock_out_lat, clock_out_lng, hours_worked, profiles(name)")
    .order("clock_in_at", { ascending: false });

  if (error) {
    dashError.textContent = error.message || "Couldn't load hours.";
    dashError.hidden = false;
    return;
  }

  allEntries = data || [];
  renderSummary(allEntries);
  renderWorkerChips(allEntries);
  renderWeeks(applyWorkerFilter(allEntries));
}

function applyWorkerFilter(entries) {
  return selectedWorkerId ? entries.filter((e) => e.worker_id === selectedWorkerId) : entries;
}

function renderSummary(entries) {
  const openCount = entries.filter((e) => !e.clock_out_at).length;
  summaryRow.innerHTML = `<div class="summary-card open"><div class="label">Currently clocked in</div><div class="value">${openCount}</div></div>`;
}

function renderWorkerChips(entries) {
  const totals = new Map(workers.map((w) => [w.id, 0]));
  entries.forEach((e) => {
    if (!totals.has(e.worker_id)) totals.set(e.worker_id, 0);
    totals.set(e.worker_id, totals.get(e.worker_id) + Number(e.hours_worked || 0));
  });
  const allTotal = [...totals.values()].reduce((a, b) => a + b, 0);

  workerChips.innerHTML = "";

  const allChip = document.createElement("button");
  allChip.type = "button";
  allChip.className = "worker-chip" + (selectedWorkerId === null ? " active" : "");
  allChip.innerHTML = `All workers <span class="hrs">${fmtHours(allTotal)}</span>`;
  allChip.addEventListener("click", () => {
    selectedWorkerId = null;
    renderWorkerChips(allEntries);
    renderWeeks(applyWorkerFilter(allEntries));
  });
  workerChips.appendChild(allChip);

  workers.forEach((w) => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "worker-chip" + (selectedWorkerId === w.id ? " active" : "");
    chip.innerHTML = `${w.name} <span class="hrs">${fmtHours(totals.get(w.id) || 0)}</span>`;
    chip.addEventListener("click", () => {
      selectedWorkerId = w.id;
      renderWorkerChips(allEntries);
      renderWeeks(applyWorkerFilter(allEntries));
    });
    workerChips.appendChild(chip);
  });
}

function buildWeekSection(label, items, isOpen) {
  const totalHours = items.reduce((sum, r) => sum + Number(r.hours_worked || 0), 0);

  const details = document.createElement("details");
  details.className = "week";
  details.open = isOpen;

  const summary = document.createElement("summary");
  const heading = isOpen ? `This week · ${label.replace("Pay week ", "")}` : label;
  summary.innerHTML = `${heading} <span class="n">· ${items.length} ${items.length === 1 ? "shift" : "shifts"} · ${fmtHours(totalHours)}</span>`;
  details.appendChild(summary);

  const body = document.createElement("div");
  body.className = "week-body";

  if (items.length === 0) {
    const empty = document.createElement("p");
    empty.className = "empty-note";
    empty.style.margin = "0";
    empty.textContent = "No shifts this week.";
    body.appendChild(empty);
  } else {
    const card = document.createElement("div");
    card.className = "card";
    const tableWrap = document.createElement("div");
    tableWrap.className = "table-wrap";
    const table = document.createElement("table");
    table.className = "hours";
    table.innerHTML = `<thead><tr><th>Worker</th><th>Clock in</th><th>Location</th><th>Clock out</th><th>Location</th><th class="hours">Hours</th></tr></thead><tbody></tbody>`;
    const tbody = table.querySelector("tbody");
    items.slice().sort((a, b) => new Date(b.clock_in_at) - new Date(a.clock_in_at)).forEach((row) => {
      const tr = document.createElement("tr");
      if (!row.clock_out_at) tr.className = "open-row";
      tr.innerHTML = `
        <td>${row.profiles?.name || "Unknown"}</td>
        <td>${fmtDateTime(row.clock_in_at)}</td>
        <td>${locLink(row.clock_in_lat, row.clock_in_lng)}</td>
        <td>${row.clock_out_at ? fmtDateTime(row.clock_out_at) : "still clocked in"}</td>
        <td>${row.clock_out_at ? locLink(row.clock_out_lat, row.clock_out_lng) : "—"}</td>
        <td class="hours">${fmtHours(row.hours_worked)}</td>
      `;
      tbody.appendChild(tr);
    });
    tableWrap.appendChild(table);
    card.appendChild(tableWrap);
    body.appendChild(card);
  }

  details.appendChild(body);
  return details;
}

function renderWeeks(entries) {
  weeksContainer.innerHTML = "";

  const weeks = groupByWeek(entries);
  const thisWeekInfo = weekInfoFor(new Date());
  const hasThisWeekData = weeks.length > 0 && weeks[0].key === thisWeekInfo.key;
  const thisWeekItems = hasThisWeekData ? weeks[0].items : [];
  const olderWeeks = hasThisWeekData ? weeks.slice(1) : weeks;

  weeksContainer.appendChild(buildWeekSection(thisWeekInfo.label, thisWeekItems, true));
  olderWeeks.forEach((w) => weeksContainer.appendChild(buildWeekSection(w.label, w.items, false)));
}

// Light auto-refresh so the "currently clocked in" view stays live.
setInterval(() => { if (!screenDashboard.hidden) loadHours(); }, 60000);

const { data: { session: existingSession } } = await supabase.auth.getSession();
if (existingSession) {
  await enterDashboard();
} else {
  showScreen(screenLogin);
}
</script>

</body>
</html>
